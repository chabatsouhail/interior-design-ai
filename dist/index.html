<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f6ef"><title>Apartment Studio</title>
<link rel="stylesheet" href="./studio.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head><body>
<svg aria-hidden="true" class="defs" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-model" viewBox="0 0 24 24"><path d="m3 7 9-5 9 5v10l-9 5-9-5z M3 7l9 5 9-5 M12 12v10"/></symbol>
<symbol id="i-walk" viewBox="0 0 24 24"><circle cx="14" cy="4" r="2"/><path d="m6 13 3-4 4-1 3 4 4 1 M12 9l-2 7-5 5 M11 14l4 2 2 5"/></symbol>
<symbol id="i-map" viewBox="0 0 24 24"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2z M9 3v16m6-14v16"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 14a3 3 0 0 1-3 3H9l-5 4V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3z M8 8h8m-8 4h5"/></symbol>
<symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3m7 7h3m-10 7v3M2 12h3"/></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="M8 5 3 10l5 5 M4 10h10a6 6 0 0 1 0 12" transform="translate(0 -2)"/></symbol>
<symbol id="i-redo" viewBox="0 0 24 24"><path d="m16 5 5 5-5 5 M20 10H10a6 6 0 0 0 0 12" transform="translate(0 -2)"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="M3 6h6m4 0h8M3 12h11m4 0h3M3 18h3m4 0h11"/><circle cx="11" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="8" cy="18" r="2"/></symbol>
<symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 8a2.7 2.7 0 0 1 5 1.4c0 2-2.5 2.1-2.5 4 M12 16h.01"/></symbol>
<symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14m-7-7v14"/></symbol>
<symbol id="i-fit" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="m4 4 17 8-17 8 3-8z M7 12h14"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12m0-12L6 18"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M18 10c0 4-6 10-6 10S6 14 6 10a6 6 0 1 1 12 0Z"/><circle cx="12" cy="10" r="2"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
<symbol id="i-region" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/><path d="M3.5 3.5h5v5h-5zm12 0h5v5h-5zm0 12h5v5h-5zm-12 0h5v5h-5z" fill="currentColor" stroke="none"/></symbol>
</defs></svg>
<header class="bar">
  <div class="brand"><svg class="brandmark" viewBox="0 0 38 40" aria-hidden="true"><path fill="#0f675a" d="M19 1 36 10.5v19L19 39 2 29.5v-19z"/><path d="m7 13 12-7 12 7-12 7z M7 13v14l12 7V20m12-7v14l-7 4v-8" fill="none" stroke="#f4f5e9" stroke-width="2.3" stroke-linejoin="round"/></svg><span>Apartment Studio</span></div>
  <nav class="modes" aria-label="View mode"><button id="overview" aria-pressed="true"><svg><use href="#i-model"/></svg>Overview</button><button id="walk" aria-pressed="false"><svg><use href="#i-walk"/></svg>Walkthrough</button></nav>
  <div class="tools"><button class="icon" id="undo" title="Undo edit" aria-label="Undo edit" disabled><svg><use href="#i-undo"/></svg></button><button class="icon" id="redo" title="Redo edit" aria-label="Redo edit" disabled><svg><use href="#i-redo"/></svg></button><i></i><button class="icon" id="settings" title="Model settings" aria-label="Model settings"><svg><use href="#i-settings"/></svg></button><button class="icon" id="help" title="Controls" aria-label="Controls"><svg><use href="#i-help"/></svg></button></div>
</header>
<main id="stage">
  <div id="viewport" tabindex="0" aria-label="Interactive 3D apartment"></div>
  <div class="view-info"><div class="eyebrow"><span class="rule"></span><span id="viewKind">CUTAWAY VIEW</span></div><h1 id="viewName">My apartment</h1>
    <div class="location"><button id="rooms" class="quiet"><svg><use href="#i-map"/></svg><span>Rooms</span><svg class="tiny"><use href="#i-down"/></svg></button><span class="divider"></span><span id="scaleHint">Approximate scale</span></div>
    <div id="roomList" class="room-list pop" hidden></div></div>
  <div id="roomLabels" aria-hidden="true"></div>
  <div id="aim" hidden></div><div id="hitLabel" hidden></div>
  <div id="notice" role="status" hidden></div><div id="fatal" hidden></div>
  <div class="navigation"><div id="zoomTools" class="toolbox"><button class="icon" id="zoomIn" title="Zoom in" aria-label="Zoom in"><svg><use href="#i-plus"/></svg></button><button class="icon" id="zoomOut" title="Zoom out" aria-label="Zoom out"><svg><use href="#i-minus"/></svg></button><i></i><button class="icon" id="fit" title="Fit apartment to view" aria-label="Fit apartment"><svg><use href="#i-fit"/></svg></button></div>
  <button id="resume" class="primary" hidden><svg><use href="#i-walk"/></svg>Resume walking</button>
  <div class="nav-hint" id="navHint">Drag to orbit <b>·</b> Scroll to zoom <b>·</b> Click to select</div></div>
  <aside id="chat" aria-label="Floating design chat">
    <div class="chat-top"><div class="icon-square"><svg><use href="#i-chat"/></svg></div><div><h2>Design chat</h2><span id="connection">ChatGPT</span></div><button class="icon" id="minChat" title="Minimize chat" aria-label="Minimize chat"><svg><use href="#i-minus"/></svg></button></div>
    <section id="chatFeed" aria-live="polite"><div id="welcome"><h3>What would you like to change?</h3><p>Click an object, or Shift-click to outline an area. Describe the edit below.</p><div class="examples"><button data-prompt="Make this surface sage green.">Recolor a surface</button><button data-prompt="Build a cat wall maze inside this outline, with staggered steps and a resting platform.">Add a cat wall maze</button></div></div><div id="messages"></div></section>
    <div class="compose"><div id="selectionRow"><svg><use href="#i-target"/></svg><span id="selectionName">No selection</span><button id="unpin" title="Undo last point" hidden>Undo point</button><button id="clear" aria-label="Clear selection" title="Clear selection" hidden>×</button></div>
    <form id="chatForm"><textarea id="request" aria-label="Design request" rows="2" placeholder="Describe a change…"></textarea><button class="send" id="send" title="Send request" aria-label="Send request" disabled><svg><use href="#i-send"/></svg></button></form>
    <a id="signIn" href="/api/login" data-oai-siwc-button>Continue with ChatGPT</a>
    <div id="accountTools" hidden><a id="usage" target="_blank" rel="noopener">Manage usage</a><button id="logout">Disconnect</button></div></div>
  </aside><button id="openChat" class="primary" hidden><svg><use href="#i-chat"/></svg>Design chat</button>
</main>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="dialogClose" class="icon" aria-label="Close"><svg><use href="#i-x"/></svg></button></div><div id="dialogBody"></div></dialog>
<script type="module" src="./studio.js"></script>
</body></html>
